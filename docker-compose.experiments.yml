services:
  controller:
    command:
      - go
      - run
      - ./cmd/controller
      - --addr
      - 0.0.0.0:9000
      - --http-addr
      - 0.0.0.0:9100
      - --health-degraded-threshold
      - ${AEGIS_DEGRADED_THRESHOLD:-1.5}
      - --health-eject-threshold
      - ${AEGIS_EJECT_THRESHOLD:-2.5}
      - --health-consecutive-windows
      - ${AEGIS_CONSECUTIVE_WINDOWS:-3}
      - --health-ejection-duration
      - ${AEGIS_EJECTION_DURATION:-30s}
      - --health-recovery-threshold
      - ${AEGIS_RECOVERY_THRESHOLD:-1.0}
      - --health-probe-success-threshold
      - ${AEGIS_PROBE_SUCCESS_THRESHOLD:-0.95}
      - --health-latency-slo
      - ${AEGIS_HEALTH_LATENCY_SLO:-0s}
      - --registry-backend
      - ${AEGIS_REGISTRY_BACKEND:-memory}
      - --registry-file
      - /data/aegis-registry.json
      - --policy-file
      - /config/demo-policy.yaml
      - --policy-reload-interval
      - ${AEGIS_POLICY_RELOAD_INTERVAL:-3s}
    volumes:
      - ./experiments/policy:/config:ro
      - aegis-controller-data:/data

  frontend-direct:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-frontend-direct
    command:
      - go
      - run
      - ./cmd/demo-frontend
      - --addr
      - 0.0.0.0:8081
      - --mesh-mode
      - direct
      - --user-target
      - user-a:7001
      - --order-target
      - order-a:7101
    depends_on:
      - user-a
      - order-a
    ports:
      - "8081:8081"

  frontend-round-robin:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-frontend-round-robin
    command:
      - go
      - run
      - ./cmd/demo-frontend
      - --addr
      - 0.0.0.0:8082
      - --controller
      - controller:9000
      - --routing-policy
      - round_robin
      - --retry-mode
      - budget
    depends_on:
      - user-a
      - user-b
      - order-a
    ports:
      - "8082:8082"

  frontend-adaptive:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-frontend-adaptive
    command:
      - go
      - run
      - ./cmd/demo-frontend
      - --addr
      - 0.0.0.0:8083
      - --controller
      - controller:9000
      - --routing-policy
      - adaptive_p2c
      - --retry-mode
      - budget
      - --trace-log
      - /traces/frontend-adaptive.jsonl
    depends_on:
      - user-a
      - user-b
      - order-a
    volumes:
      - ./experiments/traces:/traces
    ports:
      - "8083:8083"

  frontend-retry-unbudgeted:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-frontend-retry-unbudgeted
    command:
      - go
      - run
      - ./cmd/demo-frontend
      - --addr
      - 0.0.0.0:8084
      - --controller
      - controller:9000
      - --routing-policy
      - adaptive_p2c
      - --retry-mode
      - without_budget
      - --user-service
      - retry-user-service
    depends_on:
      - retry-user
      - order-a
    ports:
      - "8084:8084"

  frontend-retry-budgeted:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-frontend-retry-budgeted
    command:
      - go
      - run
      - ./cmd/demo-frontend
      - --addr
      - 0.0.0.0:8086
      - --controller
      - controller:9000
      - --routing-policy
      - adaptive_p2c
      - --retry-mode
      - budget
      - --user-service
      - retry-user-service
    depends_on:
      - retry-user
      - order-a
    ports:
      - "8086:8086"

  frontend-retry-off:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-frontend-retry-off
    command:
      - go
      - run
      - ./cmd/demo-frontend
      - --addr
      - 0.0.0.0:8085
      - --controller
      - controller:9000
      - --routing-policy
      - adaptive_p2c
      - --retry-mode
      - off
    depends_on:
      - user-a
      - user-b
      - order-a
    ports:
      - "8085:8085"

  retry-user:
    build:
      context: .
      dockerfile: docker/demo.Dockerfile
    container_name: aegis-retry-user
    command:
      - go
      - run
      - ./cmd/demo-user
      - --addr
      - retry-user:7201
      - --controller
      - controller:9000
      - --service
      - retry-user-service
      - --instance
      - retry-user-a
      - --variant
      - retry-fault
      - --error-probability
      - "1"
    depends_on:
      - controller
    ports:
      - "7201:7201"

volumes:
  aegis-controller-data:
