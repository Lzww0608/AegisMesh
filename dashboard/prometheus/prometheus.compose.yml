global:
  scrape_interval: 5s

scrape_configs:
  - job_name: aegis-controller
    static_configs:
      - targets:
          - controller:9100

  - job_name: aegis-demo-frontend
    static_configs:
      - targets:
          - frontend:8080

  - job_name: aegis-experiment-frontends
    static_configs:
      - targets:
          - frontend-direct:8081
          - frontend-round-robin:8082
          - frontend-adaptive:8083
          - frontend-retry-unbudgeted:8084
          - frontend-retry-off:8085
          - frontend-retry-budgeted:8086
