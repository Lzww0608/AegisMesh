syntax = "proto3";

package aegis.v1;

option go_package = "github.com/aegismesh/aegismesh/api/proto/aegis/v1;aegisv1";

// TelemetryService ingests SDK endpoint samples and exposes computed health state.
service TelemetryService {
  // ReportEndpointStats accepts samples that bind to active registry instances.
  rpc ReportEndpointStats(ReportEndpointStatsRequest) returns (ReportEndpointStatsResponse);
  // ListEndpointHealth returns the controller's current slow-score and state view.
  rpc ListEndpointHealth(ListEndpointHealthRequest) returns (ListEndpointHealthResponse);
}

// EndpointStatsSample is one SDK reporting-window measurement for an endpoint.
message EndpointStatsSample {
  string source = 1;
  string service = 2;
  string instance_id = 3;
  string endpoint_address = 4;
  string method = 5;
  int64 request_count = 6;
  int64 error_count = 7;
  int64 timeout_count = 8;
  int64 retry_count = 9;
  int64 inflight = 10;
  double latency_ewma_seconds = 11;
  double latency_p95_seconds = 12;
  int64 tcp_retransmit = 13;
  int64 capacity = 14;
  int64 window_start_unix_millis = 15;
  int64 window_end_unix_millis = 16;
  int64 connect_error = 17;
  // registration_epoch prevents stale SDK samples from updating a newer owner.
  string registration_epoch = 18;
}

message ReportEndpointStatsRequest {
  repeated EndpointStatsSample samples = 1;
}

message ReportEndpointStatsResponse {
  repeated EndpointHealth endpoints = 1;
}

// EndpointHealth is the controller-computed health state returned to SDK clients.
message EndpointHealth {
  string service = 1;
  string instance_id = 2;
  string endpoint_address = 3;
  // state drives resolver visibility and adaptive routing decisions.
  string state = 4;
  // slow_score combines latency, errors, inflight pressure, and optional TCP signals.
  double slow_score = 5;
  int64 consecutive_slow_windows = 6;
  int64 consecutive_eject_windows = 7;
  string registration_epoch = 8;
}

message ListEndpointHealthRequest {
  string service = 1;
}

message ListEndpointHealthResponse {
  repeated EndpointHealth endpoints = 1;
}
