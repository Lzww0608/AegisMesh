name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Experiment result smoke check
        run: python experiments/scripts/check_results.py --results experiments/results/combined --allow-partial
